<div class="site-appearance">
  <button type="button" class="site-appearance-toggle" aria-label="外观 · 切换到深色" title="切换到深色">
    <svg class="appearance-moon" aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20.6 14.2a8.8 8.8 0 0 1-10.8-10.8A8.8 8.8 0 1 0 20.6 14.2Z"/></svg>
    <svg class="appearance-sun" aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
    <span>外观</span>
  </button>
  <details class="site-appearance-menu">
    <summary aria-label="外观设置" title="外观设置">
      <svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m2.5 4.5 3.5 3.5 3.5-3.5"/></svg>
    </summary>
    <fieldset>
      <legend class="visually-hidden">网站外观</legend>
      <label><input type="radio" name="site-appearance" value="system" checked> 跟随系统</label>
      <label><input type="radio" name="site-appearance" value="light"> 浅色</label>
      <label><input type="radio" name="site-appearance" value="dark"> 深色</label>
    </fieldset>
  </details>
</div>
